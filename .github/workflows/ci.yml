name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · build + Testcontainers tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit tests + integration tests against real Postgres, Redis, LocalStack (SQS/S3) and Keycloak containers
      - run: mvn -B -ntp verify -Dsurefire.useFile=true 2>&1 | tee maven.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Test summary
        if: always()
        run: bash ../.github/scripts/test-summary.sh target/surefire-reports target/failsafe-reports
      - name: Annotate failures
        if: failure()
        run: bash ../.github/scripts/annotate-maven.sh maven.log target/surefire-reports target/failsafe-reports
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: api-test-reports
          path: |
            api/target/surefire-reports/
            api/target/failsafe-reports/
          if-no-files-found: ignore

  e2e:
    name: End to end · docker compose + scripts/demo.sh
    needs: [api]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      # core stack: Postgres, Redis, LocalStack (SQS + S3), API (dev profile) and a worker, built from this commit
      - run: docker compose -f deploy/docker-compose.yml up -d --build
      - run: scripts/demo.sh 2>&1 | tee demo.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Annotate failures
        if: failure()
        run: |
          for svc in api worker localstack; do
            body=$(docker compose -f deploy/docker-compose.yml logs --no-color --tail 60 "$svc" 2>&1 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=compose logs: $svc::${body:0:6000}"
          done
          [ -f demo.log ] && echo "::error title=demo.sh::$(tail -30 demo.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          exit 0
      - if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  web:
    name: Web · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Annotate failures
        if: failure()
        run: |
          body=$(grep -E 'error|Error|failed' -A3 build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=web build::${body}"

  manifests:
    name: Kubernetes · kustomize + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install kubeconform
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C "$HOME/bin" kubeconform
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Render prod overlay
        run: kubectl kustomize k8s/overlays/prod > rendered.yaml
      # core resources against the Kubernetes schemas; KEDA, External Secrets and Argo CD CRDs from the CRDs catalog
      - name: Validate
        run: |
          kubeconform -strict -summary -output text \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered.yaml argocd/application.yaml deploy/cluster/cluster-secret-store.yaml 2>&1 | tee kubeconform.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Annotate failures
        if: failure()
        run: |
          body=$(grep -viE '^Summary' kubeconform.log | head -30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=kubeconform::${body}"

  terraform:
    name: Terraform · fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: terraform fmt
        run: |
          if ! terraform fmt -check -recursive -diff > fmt.diff; then
            body=$(head -80 fmt.diff | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=terraform fmt::${body}"
            exit 1
          fi
      - run: terraform init -backend=false -input=false
      - name: terraform validate
        run: |
          terraform validate -json > validate.json || true
          jq -r '.diagnostics[]? | "::\(if .severity == "error" then "error" else "warning" end) title=\(.summary)::\(.range.filename // ""):\(.range.start.line // 0) \(.detail // "" | gsub("\n"; " "))"' validate.json
          jq -e '.valid' validate.json

  images:
    name: Images · ${{ matrix.app }}
    needs: [api, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v5
      - id: meta
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # pull requests only build; main publishes ghcr.io/argod2213/tenantforge-<app>:sha-<commit> for the prod overlay
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/argod2213/tenantforge-${{ matrix.app }}:sha-${{ steps.meta.outputs.short }}
            ghcr.io/argod2213/tenantforge-${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
