apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenantforge-worker
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/tenantforge-worker # IRSA: SQS receive/delete, S3/KMS on tenants/*
---
# Same image as the API, worker profile: no HTTP server, long-polls the export queue.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenantforge-worker
  labels: { app: tenantforge-worker }
spec:
  replicas: 0 # owned by KEDA below
  selector:
    matchLabels: { app: tenantforge-worker }
  template:
    metadata:
      labels: { app: tenantforge-worker }
    spec:
      serviceAccountName: tenantforge-worker
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: ghcr.io/argod2213/tenantforge-api:latest
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: worker }
          envFrom:
            - configMapRef: { name: tenantforge-config }
            - secretRef: { name: tenantforge-secrets }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
# KEDA scales workers on export-queue depth: 0 when the queue is empty, up to 20 under load.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: tenantforge-worker
spec:
  scaleTargetRef:
    name: tenantforge-worker
  minReplicaCount: 0
  maxReplicaCount: 20
  pollingInterval: 15
  cooldownPeriod: 300
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: keda-aws
      metadata:
        queueURL: https://sqs.ap-south-1.amazonaws.com/ACCOUNT_ID/tenantforge-exports
        queueLength: "20"
        awsRegion: ap-south-1
---
# KEDA reads the queue length with its own IRSA role (operator identity).
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-aws
spec:
  podIdentity:
    provider: aws
